
name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *' # Chạy mỗi giờ theo UTC
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh -s -- --system

      - name: 3. Đăng nhập Postman
        run: postman login --with-api-key "$POSTMAN_API_KEY"
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

      - name: 4. Chạy Monitor trên Postman Cloud
        run: postman monitor run "$POSTMAN_MONITOR_ID"
        env:
          POSTMAN_MONITOR_ID: ${{ vars.POSTMAN_MONITOR_ID }}
